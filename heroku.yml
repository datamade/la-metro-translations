setup:
  addons:
    - plan: heroku-postgresql
    - plan: heroku-redis
build:
  docker:
    web: Dockerfile.deploy
release:
  command:
    - ./scripts/release.sh
  image: web
run:
  web: gunicorn -t 180 -w 3 --log-level debug la_metro_translations.wsgi:application
  worker:
    command:
      - celery -A la_metro_translations worker -n celery@$DYNO --loglevel=info --concurrency=2
    image: web
